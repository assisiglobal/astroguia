<!doctype html>
<html lang="es" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3A2240" />
    <meta name="description" content="Astroguía: calcula tu carta natal y mira las lecturas que estén activas." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Astroguía" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Astroguía</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      try {
        var theme = localStorage.getItem("astroguia:theme");
        if (theme === "day" || theme === "night") {
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "day" ? "#F7F2EA" : "#3A2240");
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
